<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Planilla Mundial 2026 — Pizzas Cacho</title>
  <link rel="icon" href="assets/favicon_io/favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <style>
    /* ── Variables ────────────────────────────── */
    :root {
      --wc-gold:   #F7C948;
      --wc-gold2:  #e6a800;
      --wc-blue:   #0B3D91;
      --wc-red:    #D72638;
      --wc-green:  #2E8B57;
      --wc-white:  #FFFFFF;
      --wc-dark:   #080C14;
      --card-bg:   rgba(255,255,255,0.04);
      --card-border: rgba(247,201,72,0.18);
      --input-bg:  rgba(255,255,255,0.07);
      --text-muted: rgba(255,255,255,0.45);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: #080C14;
      font-family: 'Inter', sans-serif;
      color: #fff;
      min-height: 100vh;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background-image:
        repeating-linear-gradient(0deg, transparent, transparent 58px, rgba(46,139,87,0.035) 58px, rgba(46,139,87,0.035) 60px),
        repeating-linear-gradient(90deg, transparent, transparent 58px, rgba(46,139,87,0.035) 58px, rgba(46,139,87,0.035) 60px),
        radial-gradient(ellipse 80% 60% at 50% 0%, rgba(11,61,145,0.09) 0%, transparent 70%);
    }

    /* ── Header ───────────────────────────────── */
    .pm-header {
      position: relative;
      z-index: 10;
      text-align: center;
      padding: 48px 20px 36px;
    }

    .pm-back {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--wc-gold);
      font-family: 'Oswald', sans-serif;
      font-size: 0.75rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-decoration: none;
      margin-bottom: 28px;
      opacity: 0.7;
      transition: opacity .2s;
    }
    .pm-back:hover { opacity: 1; }

    .pm-title {
      font-family: 'Bebas Neue', cursive;
      font-size: clamp(2.8rem, 7vw, 5.5rem);
      letter-spacing: 4px;
      background: linear-gradient(135deg, #F7C948 0%, #fff 50%, #F7C948 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
      margin-bottom: 8px;
    }

    .pm-subtitle {
      font-family: 'Oswald', sans-serif;
      font-size: 0.85rem;
      letter-spacing: 3px;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-bottom: 28px;
    }

    /* ── Tabs modo (Predicción / Resultados) ─── */
    .pm-mode-tabs {
      display: inline-flex;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 4px;
      gap: 4px;
      margin-bottom: 10px;
    }
    .pm-mode-tab {
      font-family: 'Oswald', sans-serif;
      font-size: 0.82rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      padding: 9px 22px;
      border-radius: 9px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      transition: all .25s;
    }
    .pm-mode-tab.active {
      background: linear-gradient(135deg, var(--wc-gold), var(--wc-gold2));
      color: #0a0a0a;
      font-weight: 700;
      box-shadow: 0 4px 16px rgba(247,201,72,0.3);
    }
    .pm-mode-tab:not(.active):hover { color: #fff; background: rgba(255,255,255,0.07); }

    .pm-mode-badge {
      display: block;
      font-size: 0.72rem;
      letter-spacing: 1.5px;
      color: var(--text-muted);
      text-transform: uppercase;
      font-family: 'Oswald', sans-serif;
      margin-top: 6px;
    }

    /* ── Divider ──────────────────────────────── */
    .pm-divider {
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--wc-gold), var(--wc-blue), var(--wc-red), transparent);
      margin: 0 0 40px;
      opacity: .5;
    }

    /* ── Layout principal ─────────────────────── */
    .pm-container {
      position: relative;
      z-index: 2;
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 16px 80px;
    }

    /* ── Section title ────────────────────────── */
    .pm-section-title {
      font-family: 'Bebas Neue', cursive;
      font-size: 1.9rem;
      letter-spacing: 4px;
      color: var(--wc-gold);
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(247,201,72,0.2);
    }
    .pm-section-title span.icon { font-size: 1.5rem; }

    /* ── Grupos grid ──────────────────────────── */
    .pm-groups-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(345px, 1fr));
      gap: 20px;
      margin-bottom: 52px;
    }

    .pm-group-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      overflow: hidden;
      transition: border-color .2s;
    }
    .pm-group-card:hover { border-color: rgba(247,201,72,0.35); }

    .pm-group-header {
      background: linear-gradient(135deg, rgba(11,61,145,0.6), rgba(247,201,72,0.1));
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid var(--card-border);
    }
    .pm-group-letter {
      font-family: 'Bebas Neue', cursive;
      font-size: 1.6rem;
      color: var(--wc-gold);
      letter-spacing: 2px;
      line-height: 1;
    }
    .pm-group-label {
      font-family: 'Oswald', sans-serif;
      font-size: 0.65rem;
      letter-spacing: 2.5px;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    /* ── Partido row ──────────────────────────── */
    .pm-match {
      padding: 10px 14px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 8px;
    }
    .pm-match:last-child { border-bottom: none; }

    .pm-match-meta {
      display: flex;
      justify-content: flex-start;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      color: var(--text-muted);
      font-size: 0.74rem;
      letter-spacing: 1px;
    }
    .pm-match-date {
      font-family: 'Oswald', sans-serif;
      font-size: 0.72rem;
      text-transform: uppercase;
    }
    .pm-match-time {
      font-family: 'Inter', sans-serif;
      font-size: 0.72rem;
      color: rgba(255,255,255,0.7);
    }

    .pm-match-row {
      display: grid;
      grid-template-columns: 1fr minmax(94px, auto) 1fr;
      align-items: center;
      gap: 12px;
      width: 100%;
      justify-items: center;
    }

    .pm-match-team {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.86rem;
      font-weight: 600;
      min-width: 0;
      justify-self: start;
    }

    .pm-match-team-right {
      display: flex;
      align-items: center;
      justify-self: end;
      text-align: right;
    }

    .pm-match-team-right .pm-team-name,
    .pm-match-team .pm-team-name {
      display: inline-block;
      max-width: 140px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .pm-score-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-width: 110px;
      justify-self: center;
      padding: 4px 6px;
      border-radius: 12px;
      background: rgba(255,255,255,0.04);
    }

    .pm-score-input {
      width: 54px;
      min-width: 54px;
      height: 42px;
    }

    .pm-group-body {
      display: grid;
      gap: 18px;
    }

    .pm-group-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      overflow: hidden;
      transition: border-color .2s;
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding: 18px;
    }
    .pm-team.right { flex-direction: row-reverse; text-align: right; }

    .pm-team-flag { font-size: 1.1rem; line-height: 1; }
    .pm-team-name {
      font-family: 'Oswald', sans-serif;
      font-size: 0.78rem;
      font-weight: 500;
      letter-spacing: .5px;
      color: rgba(255,255,255,0.85);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 90px;
    }

    .pm-score-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 4px 6px;
      border-radius: 12px;
      background: rgba(255,255,255,0.04);
      justify-content: center;
    }
    .pm-score-input {
      width: 54px;
      min-width: 54px;
      height: 42px;
      background: var(--input-bg);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 10px;
      color: var(--wc-gold);
      font-family: 'Bebas Neue', cursive;
      font-size: 1.2rem;
      text-align: center;
      outline: none;
      transition: border-color .2s, background .2s;
      -moz-appearance: textfield;
    }
    .pm-score-input::-webkit-inner-spin-button,
    .pm-score-input::-webkit-outer-spin-button { -webkit-appearance: none; }
    .pm-score-input:focus {
      border-color: var(--wc-gold);
      background: rgba(247,201,72,0.14);
    }
    .pm-score-sep {
      font-family: 'Bebas Neue', cursive;
      font-size: 1.1rem;
      color: var(--text-muted);
    }

    /* ── Eliminatorias ────────────────────────── */
    .pm-bracket {
      margin-bottom: 52px;
    }

    .pm-bracket-rounds {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 24px;
      align-items: start;
    }

    .pm-round-col {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .pm-round-title {
      font-family: 'Oswald', sans-serif;
      font-size: 0.68rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--text-muted);
      text-align: center;
      padding: 6px 0;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      margin-bottom: 4px;
    }

    .pm-elim-match {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      overflow: hidden;
      transition: border-color .2s, transform .15s;
    }
    .pm-elim-match:hover {
      border-color: rgba(247,201,72,0.35);
      transform: translateY(-1px);
    }

    .pm-elim-match-label {
      background: rgba(11,61,145,0.3);
      padding: 4px 10px;
      font-family: 'Oswald', sans-serif;
      font-size: 0.6rem;
      letter-spacing: 2px;
      color: rgba(247,201,72,0.6);
      text-transform: uppercase;
      text-align: center;
      border-bottom: 1px solid rgba(247,201,72,0.1);
    }

    .pm-elim-team-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      transition: background .15s;
    }
    .pm-elim-team-row:last-of-type { border-bottom: none; }
    .pm-elim-team-row:hover { background: rgba(255,255,255,0.03); }

    .pm-elim-team-row.winner{
  background: rgba(247,201,72,.12);
  border-left: 4px solid var(--wc-gold);
  box-shadow: inset 0 0 12px rgba(247,201,72,.15);
}

.pm-elim-team-row.winner .pm-elim-name-input{
  color: var(--wc-gold);
  font-weight: 700;
}

.pm-elim-team-row.winner::after{
  content: "🏆";
  margin-left: auto;
  font-size: 1rem;
}

    .pm-elim-flag { font-size: 1.05rem; }

    .pm-elim-name-input {
      flex: 1;
      background: transparent;
      border: none;
      border-bottom: 1px dashed rgba(255,255,255,0.15);
      color: rgba(255,255,255,0.85);
      font-family: 'Oswald', sans-serif;
      font-size: 0.8rem;
      font-weight: 500;
      padding: 2px 4px;
      outline: none;
      transition: border-color .2s;
    }
    .pm-elim-name-input::placeholder { color: rgba(255,255,255,0.25); }
    .pm-elim-name-input:focus { border-bottom-color: var(--wc-gold); }

    .pm-elim-score-input {
      width: 36px;
      height: 30px;
      background: var(--input-bg);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 6px;
      color: var(--wc-gold);
      font-family: 'Bebas Neue', cursive;
      font-size: 1.15rem;
      text-align: center;
      outline: none;
      transition: border-color .2s;
      -moz-appearance: textfield;
    }
.pm-penalties{
  display:none;
  padding:8px 12px;
  gap:8px;
  align-items:center;
  justify-content:center;
  border-top:1px solid rgba(255,255,255,.05);
  background:rgba(255,255,255,.02);
}

.pm-penalties.show{
  display:flex;
}

.pm-penalties-label{
  font-family:'Oswald',sans-serif;
  font-size:.7rem;
  letter-spacing:1px;
  color:var(--wc-gold);
}

.pm-penalty-input{
  width:40px;
  height:30px;
  background:var(--input-bg);
  border:1px solid rgba(255,255,255,.1);
  border-radius:6px;
  color:var(--wc-gold);
  text-align:center;
  font-family:'Bebas Neue',cursive;
  font-size:1.1rem;
}

    .pm-elim-score-input::-webkit-inner-spin-button,
    .pm-elim-score-input::-webkit-outer-spin-button { -webkit-appearance: none; }
    .pm-elim-score-input:focus { border-color: var(--wc-gold); }

    /* Final destacado */
    .pm-round-col.final .pm-elim-match {
      border-color: rgba(247,201,72,0.45);
      background: rgba(247,201,72,0.04);
      box-shadow: 0 0 30px rgba(247,201,72,0.08);
    }
    .pm-round-col.final .pm-elim-match-label {
      background: linear-gradient(90deg, rgba(247,201,72,0.25), rgba(11,61,145,0.2));
      color: var(--wc-gold);
      font-size: 0.72rem;
    }
    .pm-round-col.campeon .pm-elim-match {
      border-color: rgba(247,201,72,0.7);
      background: rgba(247,201,72,0.06);
      box-shadow: 0 0 40px rgba(247,201,72,0.15), 0 0 80px rgba(247,201,72,0.06);
    }
    .pm-round-col.campeon .pm-elim-match-label {
      background: linear-gradient(90deg, var(--wc-gold), var(--wc-gold2));
      color: #080C14;
      font-weight: 700;
      font-size: 0.78rem;
      letter-spacing: 3px;
    }

    /* ── Acciones ─────────────────────────────── */
    .pm-actions {
      position: fixed;
      bottom: 24px;
      right: 24px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 100;
    }

    .pm-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 22px;
      border-radius: 12px;
      border: none;
      font-family: 'Oswald', sans-serif;
      font-size: 0.8rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all .2s;
      white-space: nowrap;
    }
    .pm-btn-save {
      background: linear-gradient(135deg, var(--wc-gold), var(--wc-gold2));
      color: #080C14;
      font-weight: 700;
      box-shadow: 0 6px 20px rgba(247,201,72,0.35);
    }
    .pm-btn-save:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(247,201,72,0.45); }
    .pm-btn-clear {
      background: rgba(215,38,56,0.15);
      color: #ff7070;
      border: 1px solid rgba(215,38,56,0.3);
    }
    .pm-btn-clear:hover { background: rgba(215,38,56,0.25); }

    /* ── Toast ────────────────────────────────── */
    .pm-toast {
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(-80px);
      background: linear-gradient(135deg, var(--wc-gold), var(--wc-gold2));
      color: #080C14;
      font-family: 'Oswald', sans-serif;
      font-size: 0.85rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      padding: 12px 28px;
      border-radius: 30px;
      font-weight: 700;
      z-index: 9999;
      transition: transform .35s cubic-bezier(.34,1.56,.64,1), opacity .3s;
      opacity: 0;
      box-shadow: 0 8px 28px rgba(247,201,72,0.4);
    }
    .pm-toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

    /* ── Responsive ───────────────────────────── */
    @media (max-width: 640px) {
      .pm-bracket-rounds { grid-template-columns: 1fr 1fr; }
      .pm-groups-grid    { grid-template-columns: 1fr; }
      .pm-actions        { bottom: 16px; right: 16px; }
    }
    @media (max-width: 420px) {
      .pm-bracket-rounds { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<!-- Toast -->
<div class="pm-toast" id="pm-toast">⚽ ¡Guardado!</div>

<!-- Header -->
<div class="pm-header">
  <a href="index.html" class="pm-back">← Volver a Pizzas Cacho</a>
  <div class="pm-title">Planilla Mundial 2026</div>
  <div class="pm-subtitle">🇺🇸 USA · 🇨🇦 Canadá · 🇲🇽 México</div>

  <div class="pm-mode-tabs">
    <button class="pm-mode-tab active" id="tab-pred" onclick="setMode('prediccion')">🔮 Predicción</button>
    <button class="pm-mode-tab" id="tab-real" onclick="setMode('real')">📊 Resultados Reales</button>
  </div>
  <span class="pm-mode-badge" id="mode-badge">Modo predicción — ingresá tus pronósticos</span>
</div>

<div class="pm-divider"></div>

<div class="pm-container">

  <!-- ══════════════════════════════════════════════
       FASE DE GRUPOS
  ══════════════════════════════════════════════ -->
  <div class="pm-section-title">
    <span class="icon">⚽</span> Fase de Grupos
  </div>
  <div class="pm-groups-grid" id="groups-grid"></div>

  <!-- ══════════════════════════════════════════════
       ELIMINATORIAS
  ══════════════════════════════════════════════ -->
  <div class="pm-section-title">
    <span class="icon">🏆</span> Eliminatorias
  </div>
  <div class="pm-bracket">
    <div class="pm-bracket-rounds" id="bracket-rounds"></div>
  </div>

</div>

<!-- Botones fijos -->
<div class="pm-actions">
  <button class="pm-btn pm-btn-save" onclick="saveData()">💾 Guardar</button>
  <button class="pm-btn pm-btn-clear" onclick="clearData()">🗑 Borrar Todo</button>
</div>

<script>
/* ─── Datos ───────────────────────────────────────────────────── */
const GROUPS = [

  },

      { f:'🇸🇪', n:'Suecia' },
      { f:'🇹🇳', n:'Túnez' }
    ]
  },
  {
    letter: 'G',
    teams: [
      { f:'🇧🇪', n:'Bélgica' },
      { f:'🇪🇬', n:'Egipto' },
      { f:'🇮🇷', n:'Irán' },
      { f:'🇳🇿', n:'Nueva Zelanda' }
    ]
  },
  {
    letter: 'H',
    teams: [
      { f:'🇪🇸', n:'España' },
      { f:'🇨🇻', n:'Cabo Verde' },
      { f:'🇸🇦', n:'Arabia Saudita' },
      { f:'🇺🇾', n:'Uruguay' }
    ]

/* ─── Render grupos ───────────────────────────────────────────── */
function renderGroups() {
  const grid = document.getElementById('groups-grid');
  grid.innerHTML = '';

  GROUPS.forEach(group => {
    const matches = getGroupMatches(group);
    const card = document.createElement('div');
    card.className = 'pm-group-card';

    card.innerHTML = `
      <div class="pm-group-header">
        <div>
          <div class="pm-group-letter">Grupo ${group.letter}</div>
          <div class="pm-group-label">${group.teams.map(t=>t.n).join(' · ')}</div>
        </div>
      </div>
      <div class="pm-group-body">
        <div class="pm-group-matches">
          ${matches.map((m, mi) => {
            const keyL = storageKey(`g${group.letter}_${mi}_l`);
            const keyR = storageKey(`g${group.letter}_${mi}_r`);
            const vL = localStorage.getItem(keyL) ?? '';
            const vR = localStorage.getItem(keyR) ?? '';
            const home = group.teams[m.home];
            const away = group.teams[m.away];
            return `
              <div class="pm-match">
                <div class="pm-match-meta">
                  <div>
                    <span class="pm-match-date">${m.date}</span>
                    <span class="pm-match-time">${m.time}</span>
                  </div>
                </div>
                <div class="pm-match-row">
                  <div class="pm-match-team">
                    <span class="pm-team-flag">${home.f}</span>
                    <span class="pm-team-name">${home.n}</span>
                  </div>
                  <div class="pm-score-wrap">
                    <input class="pm-score-input" type="number" min="0" max="99"
                      data-key="${keyL}" value="${vL}" placeholder="—">
                    <span class="pm-score-sep">:</span>
                    <input class="pm-score-input" type="number" min="0" max="99"
                      data-key="${keyR}" value="${vR}" placeholder="—">
                  </div>
                  <div class="pm-match-team pm-match-team-right">
                    <span class="pm-team-flag">${away.f}</span>
                    <span class="pm-team-name">${away.n}</span>
                  </div>
                </div>
              </div>
            `;
          }).join('')}
        </div>
      </div>
    `;
    grid.appendChild(card);
  });

  // Live save on input
  grid.querySelectorAll('.pm-score-input').forEach(inp => {
    inp.addEventListener('input', () => {
      localStorage.setItem(inp.dataset.key, inp.value);
    });
  });
}

function updatePenaltyVisibility() {
  document.querySelectorAll('.pm-elim-match').forEach(match => {
    const scores = match.querySelectorAll('.pm-elim-score-input');
    const penalties = match.querySelector('.pm-penalties');
    if (!penalties || scores.length < 2) return;

    const s1 = scores[0].value.trim();
    const s2 = scores[1].value.trim();
    const isTie = s1 !== '' && s2 !== '' && Number(s1) === Number(s2);

    if (isTie) {
      penalties.classList.add('show');
    } else {
      penalties.classList.remove('show');
    }

    const rows = match.querySelectorAll('.pm-elim-team-row');
    rows.forEach(r => r.classList.remove('winner'));

    if (!isTie) return;

    const penInputs = penalties.querySelectorAll('.pm-penalty-input');
    if (penInputs.length < 2) return;

    const p1 = penInputs[0].value.trim();
    const p2 = penInputs[1].value.trim();
    if (p1 === '' || p2 === '') return;

    const n1 = Number(p1);
    const n2 = Number(p2);
    if (Number.isNaN(n1) || Number.isNaN(n2)) return;

    if (n1 > n2) rows[0]?.classList.add('winner');
    else if (n2 > n1) rows[1]?.classList.add('winner');
  });
}

/* ─── Modo ────────────────────────────────────────────────────── */
function setMode(mode) {
  currentMode = mode;
  document.getElementById('tab-pred').classList.toggle('active', mode === 'prediccion');
  document.getElementById('tab-real').classList.toggle('active', mode === 'real');
  document.getElementById('mode-badge').textContent = mode === 'prediccion'
    ? 'Modo predicción — ingresá tus pronósticos'
    : 'Modo resultados reales — completá los marcadores oficiales';
  renderGroups();
}

document.addEventListener('input', (e) => {
  if (
    e.target.classList.contains('pm-elim-score-input') ||
    e.target.classList.contains('pm-penalty-input')
  ) {
    updatePenaltyVisibility();
  }
});

/* ─── Guardar / Limpiar ───────────────────────────────────────── */
function saveData() {
  // Todo ya se guarda live; esto solo muestra el toast
  showToast('⚽ ¡Guardado!');
}

function clearData() {
  if (!confirm(`¿Borrar TODOS los datos de "${currentMode === 'prediccion' ? 'Predicción' : 'Resultados Reales'}"?`)) return;
  const prefix = `wc2026_${currentMode}_`;
  Object.keys(localStorage).filter(k => k.startsWith(prefix)).forEach(k => localStorage.removeItem(k));
  renderGroups();
  renderBracket();
  showToast('🗑 Borrado');
}

function showToast(msg) {
  const t = document.getElementById('pm-toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

renderGroups();
renderBracket();
updatePenaltyVisibility();
